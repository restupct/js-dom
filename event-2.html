<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi To-Do List</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0efed;
      color: #2c2c2b;
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e6e5e3;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      padding: 10px 16px;
      background: #2783de;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover {
      background: #1f6fc0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: #f9f8f7;
      padding: 12px 16px;
      border: 1px solid #e6e5e3;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    li:hover {
      background: #fce9e7;
      border-color: #efc4c0;
      color: #d44f45;
    }

    li:hover::after {
      content: " (Hapus)";
      font-size: 13px;
    }

    .hint {
      font-size: 13.5px;
      color: #6f6d68;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <div class="app-container">
    <h2>Ngapain ya hari ini??</h2>

    <!-- Form untuk menambah tugas -->
    <form id="form-tugas">
      <!-- Atribut required mencegah form disubmit jika kosong -->
      <input type="text" id="input-tugas" placeholder="Ketik tugas baru..." required>
      <button type="submit" id="btn-tambah">Tambah</button>
    </form>

    <!-- Daftar tugas -->
    <ul id="list-tugas">
      <li>Mencangkul sawah bersama bapak presiden</li>
    </ul>

    <p class="hint">Petunjuk: Klik pada tugas untuk menghapusnya.</p>
  </div>

  <!-- Tulis tag script milikmu di bawah sini -->

</body>

</html>
